# Proposed clean-up plan for the Arianeplast materials.
#
# STATUS: proposal. Nothing here has been applied to data/ yet, and every
# `verify` entry is a question that must be answered from the manufacturer's
# own English product page before the change is made. Names marked
# `proposed_name` are a default to fall back on ONLY if the English page turns
# out to repeat the French wording; if the page gives its own English name,
# that name wins.
#
# Why the duplicates exist: the current entries were imported one row per
# product *listing*, and Arianeplast lists the same filament once per spool
# format (1 kg / 2.3 kg / 8 kg). In the OpenPrintTag model the spool format
# belongs to MaterialPackage, not to Material, so two listings of one colour
# must collapse into one Material with several MaterialPackages.
#
# Consequence for UUIDs: Material::uuid is UUIDv5(NAMESPACE_MATERIAL,
# brand_uuid + name). All 78 current entries derive correctly, so *any* name
# change — including a capitalisation fix — changes the uuid. The values below
# were computed with scripts/uuid_utils.py.

brand: arianeplast
brand_uuid: c4eab185-1ed0-577b-a38d-c7630cf6dd18

# ---------------------------------------------------------------------------
# 1. Duplicate pairs: same product, listed twice under two names
# ---------------------------------------------------------------------------
merges:
- id: gray
  keep: arianeplast-pla-gray            # "PLA+ Gray", 1 kg listing
  drop: arianeplast-grey-pla            # "Grey PLA+", 8 kg listing
  name: PLA+ Gray
  uuid: 92ffb7f5-0d80-5864-b3f5-d6874d7d6fca   # unchanged
  colour_conflict: false                # both #545f67ff
