description: |-
  3D Special anti-UV technical filament natural white color.
  Specially designed for outdoor applications, it resists thermal amplitudes and UV rays that degrade the quality of plastics over time.
  This material is quite fluid and very easy to use. It allows good layer adhesion as well as very good definition.
  This material is mainly used in the automotive sector, or in industries that need to be able to certify their production over time.
  The pigments used for coloring are also very high quality and stable certified over time.
  This filament is produced in France in our workshops with blank material only.
