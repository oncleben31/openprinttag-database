- id: red
  keep: arianeplast-pla-red             # "PLA+ Red", 8 kg listing
  drop: arianeplast-pla-rouge           # "PLA+ rouge", 1 kg listing
  name: PLA+ Red
  uuid: 6dec8063-9ea6-59a5-a07a-4b5e82412dcd   # unchanged
  colour_conflict: true                 # #e03f26ff vs #e72f1dff
